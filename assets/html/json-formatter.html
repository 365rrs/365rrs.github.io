<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON格式化工具</title>
    <script src="../js/vue-3.5.32.global.prod.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 20px; display: flex; flex-direction: column; }
        .container { max-width: 1200px; margin: 0 auto; width: 100%; flex: 1; display: flex; flex-direction: column; min-height: 0; }
        h1 { text-align: center; color: #1a1a2e; margin-bottom: 20px; font-size: 24px; }
        .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
        .toolbar button { padding: 6px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; color: #fff; transition: opacity .2s; }
        .toolbar button:hover { opacity: .85; }
        .btn-format { background: #1677ff; }
        .btn-compress { background: #52c41a; }
        .btn-copy { background: #722ed1; }
        .btn-clear { background: #ff4d4f; }
        .btn-escape { background: #fa8c16; }
        .btn-unescape { background: #13c2c2; }
        .toolbar select { padding: 6px 10px; border: 1px solid #d9d9d9; border-radius: 4px; font-size: 14px; }
        .panels { display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0; }
        .panel { display: flex; flex-direction: column; min-height: 0; }
        .panel-output { flex: 1; }
        .panel-label { font-size: 13px; color: #666; margin-bottom: 4px; }
        textarea { width: 100%; height: 150px; border: 1px solid #d9d9d9; border-radius: 6px; padding: 12px; font-family: 'JetBrains Mono', 'Fira Code', 'Source Code Pro', 'Consolas', 'Monaco', monospace; font-size: 14px; resize: vertical; outline: none; transition: border-color .2s; line-height: 1.7; letter-spacing: .3px; }
        textarea:focus { border-color: #1677ff; }
        .output-wrap { position: relative; width: 100%; flex: 1; min-height: 120px; border: 1px solid #d9d9d9; border-radius: 6px; background: #fafafa; overflow: auto; resize: vertical; }
        .output-wrap { display: flex; }
        .line-numbers { padding: 12px 0; background: #f0f0f0; border-right: 1px solid #d9d9d9; border-radius: 6px 0 0 6px; user-select: none; text-align: right; font-family: 'JetBrains Mono', 'Fira Code', 'Source Code Pro', 'Consolas', 'Monaco', monospace; font-size: 14px; line-height: 1.7; color: #999; min-width: 40px; flex-shrink: 0; }
        .line-numbers span { display: block; padding: 0 8px; }
        .output-wrap pre { margin: 0; padding: 12px; flex: 1; min-width: 0; font-family: 'JetBrains Mono', 'Fira Code', 'Source Code Pro', 'Consolas', 'Monaco', monospace; font-size: 14px; line-height: 1.7; letter-spacing: .3px; white-space: pre-wrap; word-break: break-all; }
        .json-key { color: #a626a4; }
        .json-string { color: #50a14f; }
        .json-number { color: #986801; }
        .json-boolean { color: #e45649; }
        .json-null { color: #999; }
        .notification { position: fixed; top: 20px; right: 20px; padding: 10px 20px; border-radius: 6px; color: #fff; font-size: 14px; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; }
        .notification.show { opacity: 1; }
        .notification.success { background: #52c41a; }
        .notification.error { background: #ff4d4f; }
        .error-line { color: #ff4d4f; font-size: 13px; margin-top: 6px; min-height: 20px; }
        @media (max-width: 768px) {
            textarea { height: 120px; }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="container">
        <h1>JSON 格式化工具</h1>
        <div class="panels">
            <div class="panel">
                <span class="panel-label">输入 JSON</span>
                <textarea v-model="input" placeholder="在此粘贴JSON内容..." spellcheck="false" @keydown.ctrl.enter="format"></textarea>
            </div>
            <div class="toolbar">
                <button class="btn-format" @click="format">格式化</button>
                <button class="btn-copy" @click="copy">复制结果</button>
                <button class="btn-clear" @click="clear">清空</button>
                <button class="btn-compress" @click="compress">压缩</button>
                <button class="btn-escape" @click="escape">转义</button>
                <button class="btn-unescape" @click="unescape">去转义</button>
                <select v-model="indent">
                    <option :value="2">缩进: 2空格</option>
                    <option :value="4">缩进: 4空格</option>
                    <option :value="1">缩进: Tab</option>
                </select>
            </div>
            <div class="panel panel-output">
                <span class="panel-label">输出结果</span>
                <div class="output-wrap">
                    <div class="line-numbers"><span v-for="n in lineCount" :key="n">{{ n }}</span></div>
                    <pre v-html="outputHtml"></pre>
                </div>
            </div>
        </div>
        <div class="error-line">{{ errorMsg }}</div>
    </div>
    <div class="notification" :class="[notify.type, {show: notify.visible}]">{{ notify.msg }}</div>
</div>

<script>
const { createApp, ref, reactive } = Vue;

createApp({
    setup() {
        const input = ref('');
        const outputHtml = ref('');
        const outputRaw = ref('');
        const lineCount = ref(0);
        const errorMsg = ref('');
        const indent = ref(2);
        const notify = reactive({ msg: '', type: 'success', visible: false });

        function showNotify(msg, type = 'success') {
            notify.msg = msg;
            notify.type = type;
            notify.visible = true;
            setTimeout(() => notify.visible = false, 2000);
        }

        function getIndent() {
            return indent.value === 1 ? '\t' : indent.value;
        }

        function tryParse(str) {
            str = str.trim();
            if (!str) throw new Error('输入内容为空');
            return JSON.parse(str);
        }

        function highlight(json) {
            return json
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/("(\\u[\da-fA-F]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, m => {
                    let cls = 'json-number';
                    if (/^"/.test(m)) cls = /:$/.test(m) ? 'json-key' : 'json-string';
                    else if (/true|false/.test(m)) cls = 'json-boolean';
                    else if (/null/.test(m)) cls = 'json-null';
                    return `<span class="${cls}">${m}</span>`;
                });
        }

        function setOutput(raw) {
            outputRaw.value = raw;
            outputHtml.value = highlight(raw);
            lineCount.value = raw ? raw.split('\n').length : 0;
            errorMsg.value = '';
        }

        function handleError(e) {
            const msg = e.message || '未知错误';
            // 尝试提取位置信息
            const posMatch = msg.match(/position\s+(\d+)/i);
            errorMsg.value = posMatch
                ? `JSON解析错误: ${msg} (第 ${posMatch[1]} 个字符附近)`
                : `JSON解析错误: ${msg}`;
        }

        function format() {
            try {
                const obj = tryParse(input.value);
                setOutput(JSON.stringify(obj, null, getIndent()));
            } catch (e) { handleError(e); }
        }

        function compress() {
            try {
                const obj = tryParse(input.value);
                setOutput(JSON.stringify(obj));
            } catch (e) { handleError(e); }
        }

        function escape() {
            const s = input.value.trim();
            if (!s) return;
            setOutput(JSON.stringify(s));
        }

        function unescape() {
            try {
                const s = input.value.trim();
                if (!s) return;
                const parsed = JSON.parse(s);
                if (typeof parsed === 'string') {
                    input.value = parsed;
                    // 再尝试格式化
                    try {
                        const obj = JSON.parse(parsed);
                        setOutput(JSON.stringify(obj, null, getIndent()));
                    } catch { setOutput(parsed); }
                } else {
                    setOutput(JSON.stringify(parsed, null, getIndent()));
                }
            } catch (e) { handleError(e); }
        }

        function copy() {
            if (!outputRaw.value) { showNotify('没有可复制的内容', 'error'); return; }
            navigator.clipboard.writeText(outputRaw.value)
                .then(() => showNotify('复制成功！'))
                .catch(() => showNotify('复制失败', 'error'));
        }

        function clear() {
            input.value = '';
            outputHtml.value = '';
            outputRaw.value = '';
            lineCount.value = 0;
            errorMsg.value = '';
        }

        return { input, outputHtml, lineCount, errorMsg, indent, notify, format, compress, escape, unescape, copy, clear };
    }
}).mount('#app');
</script>
</body>
</html>
