<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4字节UTF-8字符检测工具</title>
  <!-- 引入Vue CDN -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
  <style>
    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      font-family: sans-serif;
    }
    textarea {
      width: 100%;
      height: 120px;
      margin: 10px 0;
      padding: 10px;
      font-size: 16px;
    }
    .btn-group {
      margin: 10px 0;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
      background: #42b983;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 14px;
    }
    button:hover {
      background: #359e75;
    }
    .result {
      margin: 15px 0;
      padding: 10px;
      border: 1px solid #eee;
      border-radius: 4px;
    }
    .warning {
      color: #e74c3c;
    }
    .success {
      color: #2ecc71;
    }
    .highlight {
      background: #fff3cd;
      padding: 2px 4px;
      border-radius: 2px;
    }
    .result-section {
      margin-bottom: 20px;
      border-bottom: 1px solid #eee;
      padding-bottom: 15px;
    }
    .result-section:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }
    .clear-btn {
      background: #e74c3c !important;
    }
  </style>
</head>
<body>
<div class="container" id="app">
  <h2>4字节UTF-8字符检测工具</h2>
  <p>用于检测字符串中是否包含4字节UTF-8字符（如𤠣、😀、𝌆等，下游utf8mb3不支持）</p>

  <textarea
          v-model="inputStr"
          placeholder="请输入需要检测的字符串..."
  ></textarea>

  <div class="btn-group">
    <button @click="check4ByteChars">检测是否包含4字节字符</button>
    <button @click="extract4ByteChars">提取所有4字节字符</button>
    <button @click="replace4ByteChars">替换4字节字符为�</button>
    <button @click="clearAll" class="clear-btn">清空</button>
  </div>

  <div class="result" v-if="anyResultVisible">
    <div class="result-section" v-if="checkResult.visible">
      <h3>检测结果：</h3>
      <p v-if="checkResult.has4Byte" class="warning">
        包含4字节UTF-8字符！
      </p>
      <p v-else class="success">
        不包含4字节UTF-8字符，可兼容下游utf8mb3。
      </p>
    </div>

    <div class="result-section" v-if="extractResult.visible">
      <h3>提取结果：</h3>
      <p v-if="extractResult.has4Byte" class="warning">
        包含4字节UTF-8字符！
      </p>
      <p v-else class="success">
        不包含4字节UTF-8字符，可兼容下游utf8mb3。
      </p>

      <p v-if="extractResult.chars.length > 0">
        提取到的4字节字符：
        <span v-for="(char, index) in extractResult.chars" :key="index" class="highlight">{{ char }}</span>
      </p>
    </div>

    <div class="result-section" v-if="replaceResult.visible">
      <h3>替换结果：</h3>
      <p v-if="replaceResult.has4Byte" class="warning">
        包含4字节UTF-8字符！
      </p>
      <p v-else class="success">
        不包含4字节UTF-8字符，可兼容下游utf8mb3。
      </p>

      <p v-if="replaceResult.str">
        替换后字符串：<br>
        <span>{{ replaceResult.str }}</span>
      </p>
    </div>
  </div>
</div>

<script>
  new Vue({
    el: '#app',
    data() {
      return {
        inputStr: '',       // 输入的字符串
        checkResult: {
          has4Byte: false,
          visible: false
        },
        extractResult: {
          chars: [],
          has4Byte: false,
          visible: false
        },
        replaceResult: {
          str: '',
          has4Byte: false,
          visible: false
        }
      }
    },
    computed: {
      anyResultVisible() {
        return this.checkResult.visible || 
               this.extractResult.visible || 
               this.replaceResult.visible;
      }
    },
    methods: {
      // 检测是否包含4字节UTF-8字符（Unicode U+10000 ~ U+10FFFF）
      check4ByteChars() {
        this.checkResult.has4Byte = false;
        this.checkResult.visible = true;

        if (!this.inputStr) return;

        // 遍历字符串的所有代码点
        for (let i = 0; i < this.inputStr.length; ) {
          const codePoint = this.inputStr.codePointAt(i);
          // 判断是否为4字节字符（Unicode >= U+10000）
          if (codePoint >= 0x10000 && codePoint <= 0x10FFFF) {
            this.checkResult.has4Byte = true;
            break; // 只要找到一个就可确定
          }
          // 移动索引（非补充字符占1个位置，补充字符占2个）
          i += codePoint > 0xFFFF ? 2 : 1;
        }
      },

      // 提取所有4字节字符
      extract4ByteChars() {
        this.extractResult.chars = [];
        this.extractResult.has4Byte = false;
        this.extractResult.visible = true;

        if (!this.inputStr) return;

        for (let i = 0; i < this.inputStr.length; ) {
          const codePoint = this.inputStr.codePointAt(i);
          if (codePoint >= 0x10000 && codePoint <= 0x10FFFF) {
            this.extractResult.has4Byte = true;
            // 将代码点转换为字符（处理代理对）
            this.extractResult.chars.push(String.fromCodePoint(codePoint));
          }
          i += codePoint > 0xFFFF ? 2 : 1;
        }
      },

      // 替换所有4字节字符为�（U+FFFD，3字节，兼容utf8mb3）
      replace4ByteChars() {
        this.replaceResult.str = '';
        this.replaceResult.has4Byte = false;
        this.replaceResult.visible = true;

        if (!this.inputStr) return;

        let result = '';
        for (let i = 0; i < this.inputStr.length; ) {
          const codePoint = this.inputStr.codePointAt(i);
          if (codePoint >= 0x10000 && codePoint <= 0x10FFFF) {
            this.replaceResult.has4Byte = true;
            result += '�'; // 替换为3字节兼容字符
          } else {
            result += String.fromCodePoint(codePoint);
          }
          i += codePoint > 0xFFFF ? 2 : 1;
        }
        this.replaceResult.str = result;
      },
      // 清空所有内容
      clearAll() {
        this.inputStr = '';
        this.checkResult = {
          has4Byte: false,
          visible: false
        };
        this.extractResult = {
          chars: [],
          has4Byte: false,
          visible: false
        };
        this.replaceResult = {
          str: '',
          has4Byte: false,
          visible: false
        };
      }
    }
  });
</script>
</body>
</html>
