<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>日志格式化工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .input-area {
            margin-bottom: 30px;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
            font-size: 14px;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            background: #409eff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        button:hover {
            background: #66b1ff;
        }
        .result-area {
            padding: 20px;
            background: #f5f7fa;
            border-radius: 4px;
        }
        .log-section {
            margin-bottom: 20px;
            padding: 15px;
            background: #fff;
            border-radius: 4px;
            border-left: 3px solid #409eff;
        }
        .log-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
            display: flex;
            justify-content: space-between;
        }
        .copy-btn {
            padding: 2px 8px;
            background: #409eff;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        .copy-btn:hover {
            background: #66b1ff;
        }
        .format-btn {
            padding: 2px 8px;
            background: #e6a23c;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 5px;
        }
        .format-btn:hover {
            background: #ebb563;
        }
        .log-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .log-table th, .log-table td {
            padding: 10px;
            border: 1px solid #eee;
            text-align: left;
        }
        .log-table th {
            background: #f9f9f9;
            color: #666;
            width: 20%;
        }
        .json-content {
            padding: 10px;
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 4px;
            font-family: "Consolas", monospace;
            font-size: 14px;
            white-space: pre-wrap;
            color: #333;
            max-height: 300px;
            overflow-y: auto;
        }

        /* JSON 着色样式 */
        .json-key {
            color: #9225ba;
        }
        .json-string {
            color: #008000;
        }
        .json-number {
            color: #0000ff;
        }
        .json-boolean {
            color: #ff0000;
        }
        .json-null {
            color: #808080;
        }

        .timezone-btn {
            padding: 2px 8px;
            background: #67c23a;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            margin-left: 10px;
        }
        .timezone-btn:hover {
            background: #85ce61;
        }

        .timezone-info {
            font-size: 12px;
            color: #999;
            margin-left: 10px;
        }

        .error提示 {
            color: #f56c6c;
            font-size: 14px;
            margin-top: 10px;
        }
        .success提示 {
            color: #67c23a;
            font-size: 14px;
            margin-top: 10px;
        }

        /* 优化长URL显示 */
        .url-content {
            word-break: break-all;
            word-wrap: break-word;
            max-width: 100%;
            overflow-wrap: break-word;
        }

        /* URL容器样式 */
        .url-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 提示框样式优化 */
        .notification {
            position: fixed;
            top: 20px;
            right: -400px; /* 初始位置在视窗外 */
            padding: 15px 20px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            transition: right 0.3s ease-in-out;
        }

        .notification.show {
            right: 20px; /* 显示位置 */
        }


        .notification.success {
            background-color: #67c23a;
        }

        .notification.error {
            background-color: #f56c6c;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 日志输入区 -->
    <div class="input-area">
        <textarea id="logInput" placeholder="请粘贴控制台打印的日志（示例：2025-10-17 08:51:10.24...）"></textarea>
        <button onclick="parseLog()">解析日志</button>
        <button onclick="clearAll()">清空</button>
        <button onclick="copyAllInfo()" style="background:#67c23a;">一键复制</button>
        <button onclick="downloadAllInfo()" style="background:#e6a23c;">下载</button>
    </div>

    <!-- 解析结果展示区 -->
    <div class="result-area" id="resultArea" style="display: none;">
        <!-- 追踪信息区 -->
        <div class="log-section">
            <div class="log-title">0. 追踪信息</div>
            <table class="log-table" id="traceInfoTable"></table>
        </div>

        <!-- 基本信息区 -->
        <div class="log-section">
            <div class="log-title">1. 接口基本信息</div>
            <table class="log-table" id="basicInfoTable"></table>
        </div>

        <!-- URL参数区 -->
        <div class="log-section">
            <div class="log-title">1.1 URL参数</div>
            <table class="log-table" id="urlParamsTable"></table>
        </div>

        <!-- 请求体区 -->
        <div class="log-section">
            <div class="log-title">
                <span>2. 请求体（REQ BODY）</span>
                <span>
                    <button class="format-btn" id="reqBodyFormatBtn" onclick="toggleJsonFormat('reqBody')">压缩</button>
                    <button class="copy-btn" onclick="copyToClipboard('reqBodyContent')">复制</button>
                </span>
            </div>
            <div id="reqBodyContent" class="json-content"></div>
        </div>

        <!-- 响应体区 -->
        <div class="log-section">
            <div class="log-title">
                <span>3. 响应体（RESP BODY）</span>
                <span>
                    <button class="format-btn" id="respBodyFormatBtn" onclick="toggleJsonFormat('respBody')">压缩</button>
                    <button class="copy-btn" onclick="copyToClipboard('respBodyContent')">复制</button>
                </span>
            </div>
            <div id="respBodyContent" class="json-content"></div>
        </div>

        <!-- 请求头区 -->
        <div class="log-section">
            <div class="log-title">
                4. 请求头（REQ HEADER）
                <button class="copy-btn" onclick="copyToClipboard('reqHeaderContent')">复制</button>
            </div>
            <div id="reqHeaderContent" class="json-content"></div>
        </div>
    </div>

    <!-- 错误提示区 -->
    <div id="errorTip" class="error提示" style="display: none;"></div>
    <div id="successTip" class="success提示" style="display: none;"></div>

    <!-- 新增的通知框 -->
    <div id="notification" class="notification"></div>
</div>

<script>
    // 时区状态变量 - 默认设置为 utc8
    let currentTimezone = 'utc8'; // utc, utc8

    // 存储原始JSON数据和当前展示模式
    const jsonRawData = { reqBody: '', respBody: '' };
    const jsonFormatMode = { reqBody: 'formatted', respBody: 'formatted' };

    // 基于关键字解析日志的核心函数
    function parseLog() {
        // 1. 获取输入的日志内容
        const logText = document.getElementById("logInput").value.trim();
        if (!logText) {
            showError("请先粘贴日志内容！");
            return;
        }

        try {
            // 2. 智能提取日志打印时间
            const timeAnalysis = extractAndAnalyzeLogTime(logText);
            console.log("timeAnalysis:", timeAnalysis);

            // 3. 提取追踪信息
            const traceInfo = extractTraceInfo(logText);

            // 4. 提取基本信息部分
            const basicInfoPart = extractBasicInfo(logText);
            if (!basicInfoPart) {
                showError("无法解析基本信息部分，请检查日志格式");
                return;
            }

            // 5. 提取各部分内容
            const reqBody = extractSectionContent(logText, "[REQ BODY =>", "]");
            const respBody = extractSectionContent(logText, "[RESP BODY =>", "]");
            const reqHeader = extractSectionContent(logText, "[REQ HEADER =>", "]");

            // 6. 构造日志数据对象
            const logData = {
                logTime: timeAnalysis.time || "无",
                timezoneInfo: timeAnalysis.timezoneInfo || "unknown",
                originalTimes: timeAnalysis.originalTimes || [],
                traceId: traceInfo.traceId || "无",
                spanId: traceInfo.spanId || "无",
                method: basicInfoPart.method || "无",
                url: basicInfoPart.url || "无",
                responseCode: basicInfoPart.responseCode || "无",
                responseMsg: basicInfoPart.responseMsg || "空",
                reqBody: reqBody || "无",
                respBody: respBody || "无",
                reqHeader: reqHeader || "无"
            };

            // 7. 格式化展示数据
            renderResult(logData);
        } catch (e) {
            showError("日志解析失败: " + e.message);
        }
    }

    // 智能提取和识别日志时间
    function extractAndAnalyzeLogTime(logText) {
        // 查找所有可能的时间戳
        const timeMatches = logText.match(/\d{4}-\d{2}-\d{2}\s\d{2}:\d{2}:\d{2}\.\d{2,3}/g);

        if (!timeMatches || timeMatches.length === 0) {
            return { time: null, timezoneInfo: 'unknown' };
        }

        // 如果只有一个时间戳，假定为UTC时间
        if (timeMatches.length === 1) {
            console.log('Only one time found, assuming UTC')
            console.log('time:'+timeMatches[0])
            currentTimezone = 'utc8'; // 默认显示UTC+8
            return {
                time: timeMatches[0],
                timezoneInfo: 'assumed_utc',
                originalTimes: timeMatches
            };
        }

        // 如果有多个时间戳，分析它们之间的差异
        if (timeMatches.length >= 2) {
            console.log('Multiple times found, analyzing differences')
            console.log('timeMatches:'+timeMatches)
            const firstTime = new Date(timeMatches[0].replace(' ', 'T'));
            const secondTime = new Date(timeMatches[1].replace(' ', 'T'));

            // 计算小时差
            const hourDiff = Math.abs(firstTime.getHours() - secondTime.getHours());

            // 如果相差8小时左右，可能是本地时间和UTC时间
            if (hourDiff === 8 || hourDiff === 16) {
                // 返回UTC时间（假设第二个是UTC时间）
                currentTimezone = 'utc8'; // 默认显示UTC+8
                return {
                    time: timeMatches[1],
                    timezoneInfo: 'assumed_utc',
                    originalTimes: timeMatches
                };
            }
        }

        // 默认返回第一个时间戳
        return {
            time: timeMatches[0],
            timezoneInfo: 'default',
            originalTimes: timeMatches
        };
    }

    // 提取追踪信息
    function extractTraceInfo(logText) {
        const traceMatch = logText.match(/trace_id=([^\s]+)\s+span_id=([^\s]+)/);
        return {
            traceId: traceMatch ? traceMatch[1] : null,
            spanId: traceMatch ? traceMatch[2] : null
        };
    }

    // 提取基本信息部分
    function extractBasicInfo(logText) {
        // 匹配 [模块](业务码) ---> 方法, URL, 响应码, 响应信息 的格式
        const basicInfoMatch = logText.match(/\[([^\]]*?)\]\(([^\)]*?)\) ---> (.*?)(?: \[REQ BODY =>|$)/);
        if (!basicInfoMatch) {
            return null;
        }

        // 解析方法、URL、响应码、响应信息
        const basicParts = basicInfoMatch[3].split(", ");

        return {
            method: basicParts[0],
            url: basicParts[1],
            responseCode: basicParts[2],
            responseMsg: basicParts[3]
        };
    }

    // 提取指定标记间的内容
    function extractSectionContent(text, startMarker, endMarker) {
        const startIndex = text.indexOf(startMarker);
        if (startIndex === -1) return "";

        const contentStart = startIndex + startMarker.length;
        // 寻找对应的结束标记
        let endIndex = contentStart;
        let bracketCount = 1;

        // 处理嵌套的方括号情况
        for (let i = contentStart; i < text.length; i++) {
            if (text[i] === '[') {
                bracketCount++;
            } else if (text[i] === ']') {
                bracketCount--;
                if (bracketCount === 0) {
                    endIndex = i;
                    break;
                }
            }
        }

        if (bracketCount !== 0) {
            // 如果没有找到匹配的结束标记，尝试使用简单的查找
            endIndex = text.indexOf(endMarker, contentStart);
            if (endIndex === -1) return "";
        }

        return text.substring(contentStart, endIndex).trim();
    }

    // 解析URL参数
    function parseUrlParams(url) {
        try {
            const urlObj = new URL(url);
            const params = {};
            for (const [key, value] of urlObj.searchParams) {
                params[key] = value;
            }
            return params;
        } catch (e) {
            return {};
        }
    }

    // 格式化展示解析结果
    function renderResult(logData) {
        document.getElementById("errorTip").style.display = "none";
        const resultArea = document.getElementById("resultArea");
        resultArea.style.display = "block";

        // 渲染追踪信息表格（包含调用时间）
        const traceTable = document.getElementById("traceInfoTable");
        console.log('logData:'+logData)
        const formattedTime = formatLogTime(logData.logTime);
        console.log('formattedTime:'+formattedTime)

        traceTable.innerHTML = `
                <tr>
                    <th>调用时间</th>
                    <td>
                        ${formattedTime}
                        <button class="timezone-btn" onclick="toggleTimezone('${logData.logTime}', '${logData.timezoneInfo}')">切换时区</button>
                        <span id="timezoneLabel"></span>
                    </td>
                </tr>
                <tr><th>Trace ID</th><td>${logData.traceId}</td></tr>
                <tr><th>Span ID</th><td>${logData.spanId}</td></tr>
            `;

        // 更新时区标签
        updateTimezoneLabel();

        // 渲染基本信息表格（已删除模块和业务码）
        const basicTable = document.getElementById("basicInfoTable");
        basicTable.innerHTML = `
                <tr><th>请求方法</th><td>${logData.method}</td></tr>
                <tr>
                    <th>请求URL</th>
                    <td class="url-content">
                        <div class="url-container">
                            <span style="flex: 1; word-break: break-all;" id="urlText">${logData.url}</span>
                            <button class="copy-btn" onclick="copyUrlToClipboard()">复制</button>
                        </div>
                    </td>
                </tr>
                <tr><th>响应码</th><td>${logData.responseCode}</td></tr>
                <tr><th>响应信息</th><td>${logData.responseMsg}</td></tr>
            `;

        // 渲染URL参数表格
        const urlParamsTable = document.getElementById("urlParamsTable");
        const urlParams = parseUrlParams(logData.url);
        let urlParamsHtml = "";
        if (Object.keys(urlParams).length > 0) {
            for (const [key, value] of Object.entries(urlParams)) {
                urlParamsHtml += `<tr><th>${key}</th><td class="url-content">${value}</td></tr>`;
            }
        } else {
            urlParamsHtml = "<tr><td colspan='2'>无URL参数</td></tr>";
        }
        urlParamsTable.innerHTML = urlParamsHtml;

        // 保存原始数据并重置格式化状态
        jsonRawData.reqBody = logData.reqBody;
        jsonRawData.respBody = logData.respBody;
        jsonFormatMode.reqBody = 'compressed';
        jsonFormatMode.respBody = 'compressed';
        document.getElementById('reqBodyFormatBtn').textContent = '格式化';
        document.getElementById('respBodyFormatBtn').textContent = '格式化';

        // 渲染请求体
        const reqBodyEl = document.getElementById("reqBodyContent");
        reqBodyEl.innerHTML = formatParamCompressed(logData.reqBody);

        // 渲染响应体
        const respBodyEl = document.getElementById("respBodyContent");
        respBodyEl.innerHTML = formatJsonCompressed(logData.respBody);

        // 渲染请求头（JSON美化并着色）
        const reqHeaderEl = document.getElementById("reqHeaderContent");
        reqHeaderEl.innerHTML = formatJson(logData.reqHeader);
    }

    // 格式化日志时间显示
    function formatLogTime(timeStr) {
        if (timeStr === "无") return timeStr;

        try {
            // 创建Date对象时明确指定时区
            // 如果 currentTimezone 是 'utc'，则添加 'Z' 表示 UTC 时间
            let date;
            if (currentTimezone === 'utc') {
                date = new Date(timeStr.replace(' ', 'T') + 'Z');
            } else {
                // 对于UTC+8时间，直接创建 Date 对象
                date = new Date(timeStr.replace(' ', 'T'));
            }

            // 检查日期是否有效
            if (isNaN(date.getTime())) {
                return timeStr;
            }

            // 根据当前时区设置格式化时间（只保留utc和utc8）
            switch(currentTimezone) {
                case 'utc':
                    // UTC时间
                    return date.toISOString().replace('T', ' ').substring(0, 23);
                case 'utc8':
                    // 东八区时间
                    const utc8Date = new Date(date.getTime() + 8 * 60 * 60 * 1000);
                    // return utc8Date.toISOString().replace('T', ' ').substring(0, 23);
                    return utc8Date.toLocaleString('zh-CN', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: false
                    }).replace(/\//g, '-');
                default:
                    // 默认使用UTC+8时间
                    const defaultUtc8Date = new Date(date.getTime() + 8 * 60 * 60 * 1000);
                    return defaultUtc8Date.toLocaleString('zh-CN', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: false
                    }).replace(/\//g, '-');
            }
        } catch (e) {
            return timeStr;
        }
    }

    // 切换时区显示
    function toggleTimezone(originalTime, timezoneInfo) {
        // 切换时区状态（只在utc和 utc8之间切换）
        switch(currentTimezone) {
            case 'utc':
                currentTimezone = 'utc8';
                break;
            case 'utc8':
                currentTimezone = 'utc';
                break;
            default:
                currentTimezone = 'utc8';
        }

        // 更新时区标签
        updateTimezoneLabel();

        // 重新格式化时间显示
        const timeCell = document.querySelector('#traceInfoTable tr:first-child td');
        if (timeCell) {
            const formattedTime = formatLogTime(originalTime);
            timeCell.innerHTML = `
                ${formattedTime}
                <button class="timezone-btn" onclick="toggleTimezone('${originalTime}', '${timezoneInfo}')">切换时区</button>
                <span id="timezoneLabel"></span>
            `;
            updateTimezoneLabel(); // 重新设置标签
        }
    }

    // 更新时区标签显示
    function updateTimezoneLabel() {
        const labelElement = document.getElementById('timezoneLabel');
        if (labelElement) {
            switch(currentTimezone) {
                case 'utc':
                    labelElement.textContent = '(UTC)';
                    break;
                case 'utc8':
                    labelElement.textContent = '(UTC+8)';
                    break;
                default:
                    labelElement.textContent = '(UTC+8)';
            }
        }
    }

    // 压缩格式的JSON渲染
    function formatJsonCompressed(jsonStr) {
        if (jsonStr === '无' || jsonStr === '') return '无';
        try {
            if ((jsonStr.startsWith('{') && jsonStr.endsWith('}')) ||
                (jsonStr.startsWith('[') && jsonStr.endsWith(']'))) {
                return syntaxHighlight(JSON.parse(jsonStr), true);
            }
            return jsonStr;
        } catch (e) {
            return jsonStr;
        }
    }

    function formatParamCompressed(paramStr) {
        if (paramStr === '无' || paramStr === '') return '无';
        if (paramStr.startsWith('{') || paramStr.startsWith('[')) {
            return formatJsonCompressed(paramStr);
        }
        return formatParam(paramStr);
    }

    // 辅助函数：格式化URL参数（app_key=xxx&method=xxx 转清晰格式）
    function formatParam(paramStr) {
        if (paramStr === "无" || paramStr === "") return "无";
        // 处理JSON格式的请求体
        if (paramStr.startsWith('{') || paramStr.startsWith('[')) {
            return formatJson(paramStr);
        }
        const paramArr = paramStr.split("&");
        let paramHtml = "";
        paramArr.forEach(param => {
            const [key, value] = param.split("=");
            // 解码URL编码（如%20转空格）
            const decodeValue = value ? decodeURIComponent(value) : "无";
            paramHtml += `${key || "未知键"}: ${decodeValue}\n`;
        });
        return paramHtml;
    }

    // 辅助函数：格式化并着色JSON字符串
    function formatJson(jsonStr) {
        if (jsonStr === "无" || jsonStr === "") return "无";
        try {
            if ((jsonStr.startsWith('{') && jsonStr.endsWith('}')) ||
                (jsonStr.startsWith('[') && jsonStr.endsWith(']'))) {
                const jsonObj = JSON.parse(jsonStr);
                return syntaxHighlight(jsonObj, false);
            } else {
                return jsonStr;
            }
        } catch (e) {
            return jsonStr;
        }
    }

    // 切换JSON压缩/格式化
    function toggleJsonFormat(type) {
        const raw = jsonRawData[type];
        if (!raw || raw === '无' || raw === '') return;

        const elId = type === 'reqBody' ? 'reqBodyContent' : 'respBodyContent';
        const btnId = type === 'reqBody' ? 'reqBodyFormatBtn' : 'respBodyFormatBtn';
        const el = document.getElementById(elId);

        try {
            const obj = JSON.parse(raw);
            if (jsonFormatMode[type] === 'formatted') {
                jsonFormatMode[type] = 'compressed';
                el.innerHTML = syntaxHighlight(obj, true);
                document.getElementById(btnId).textContent = '格式化';
            } else {
                jsonFormatMode[type] = 'formatted';
                el.innerHTML = syntaxHighlight(obj, false);
                document.getElementById(btnId).textContent = '压缩';
            }
        } catch (e) {
            // 非JSON内容不处理
        }
    }

    // JSON语法高亮函数
    function syntaxHighlight(json, compress) {
        if (typeof json != 'string') {
            json = compress ? JSON.stringify(json) : JSON.stringify(json, undefined, 2);
        }

        // 转义HTML特殊字符
        json = json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

        // 应用语法高亮
        return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
            let cls = 'json-number';
            if (/^"/.test(match)) {
                if (/:$/.test(match)) {
                    cls = 'json-key';
                } else {
                    cls = 'json-string';
                }
            } else if (/true|false/.test(match)) {
                cls = 'json-boolean';
            } else if (/null/.test(match)) {
                cls = 'json-null';
            }
            return '<span class="' + cls + '">' + match + '</span>';
        });
    }

    // 辅助函数：显示错误提示
    function showError(msg) {
        const errorEl = document.getElementById("errorTip");
        errorEl.textContent = msg;
        errorEl.style.display = "block";
        document.getElementById("resultArea").style.display = "none";
        document.getElementById("successTip").style.display = "none";
    }

    // 辅助函数：显示成功提示
    function showSuccess(msg) {
        const successEl = document.getElementById("successTip");
        successEl.textContent = msg;
        successEl.style.display = "block";
        document.getElementById("errorTip").style.display = "none";

        // 3秒后自动隐藏
        setTimeout(() => {
            successEl.style.display = "none";
        }, 3000);
    }

    // 显示通知函数
    function showNotification(message, type = 'success') {
        const notification = document.getElementById('notification');
        notification.textContent = message;
        notification.className = 'notification ' + type;

        // 显示通知
        setTimeout(() => {
            notification.classList.add('show');
        }, 10);

        // 3秒后隐藏通知
        setTimeout(() => {
            notification.classList.remove('show');
        }, 3000);
    }

    // 复制到剪贴板功能
    function copyToClipboard(elementId) {
        const content = document.getElementById(elementId).innerText;
        navigator.clipboard.writeText(content)
            .then(() => {
                showNotification("复制成功！");
            })
            .catch(err => {
                showNotification("复制失败：" + err, 'error');
            });
    }

    // 复制URL到剪贴板功能
    function copyUrlToClipboard() {
        const urlText = document.getElementById("urlText").textContent;
        navigator.clipboard.writeText(urlText)
            .then(() => {
                showNotification("URL复制成功！");
            })
            .catch(err => {
                showNotification("复制失败：" + err, 'error');
            });
    }

    // 构建所有关键信息文本（复制和下载共用）
    function buildAllInfoText() {
        // 调用时间
        const timeRow = document.querySelector('#traceInfoTable tr:first-child td');
        const time = timeRow ? timeRow.firstChild.textContent.trim() : '无';

        // Trace ID
        const traceRow = document.querySelector('#traceInfoTable tr:nth-child(2) td');
        const traceId = traceRow ? traceRow.textContent.trim() : '无';

        // 请求URL
        const urlEl = document.getElementById('urlText');
        const url = urlEl ? urlEl.textContent.trim() : '无';

        // URL参数
        const urlParamsTable = document.getElementById('urlParamsTable');
        let urlParams = '';
        urlParamsTable.querySelectorAll('tr').forEach(row => {
            const th = row.querySelector('th');
            const td = row.querySelector('td');
            if (th && td) {
                urlParams += `  ${th.textContent}: ${td.textContent}\n`;
            } else if (td) {
                urlParams += `  ${td.textContent}\n`;
            }
        });

        // 请求体、响应体
        const reqBody = document.getElementById('reqBodyContent').innerText;
        const respBody = document.getElementById('respBodyContent').innerText;

        const parts = [
            `调用时间: ${time}`,
            `Trace ID: ${traceId}`,
            `请求URL: ${url}`,
        ];
        parts.push(`request body:\n${reqBody}`, `response body:\n${respBody}`);
        return parts.join('\n\n') + '\n';
    }

    // 一键复制所有关键信息
    function copyAllInfo() {
        const resultArea = document.getElementById('resultArea');
        if (resultArea.style.display === 'none') {
            showNotification('请先解析日志！', 'error');
            return;
        }

        const text = buildAllInfoText();

        navigator.clipboard.writeText(text)
            .then(() => showNotification('一键复制成功！'))
            .catch(err => showNotification('复制失败：' + err, 'error'));
    }

    // 一键下载所有关键信息为txt文件
    function downloadAllInfo() {
        const resultArea = document.getElementById('resultArea');
        if (resultArea.style.display === 'none') {
            showNotification('请先解析日志！', 'error');
            return;
        }

        const text = buildAllInfoText();
        const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = new Date().getTime() + '.txt';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showNotification('下载成功！');
    }

    // 清空功能
    function clearAll() {
        document.getElementById("logInput").value = "";
        document.getElementById("resultArea").style.display = "none";
        document.getElementById("errorTip").style.display = "none";
        document.getElementById("successTip").style.display = "none";
    }
</script>
</body>
</html>
