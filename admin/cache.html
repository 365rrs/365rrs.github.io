<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="viggo" />
    <title>WebStack 管理面板 - 缓存管理</title>
    <link rel="shortcut icon" href="../assets/images/favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Arimo:400,700,400italic">
    <link rel="stylesheet" href="../assets/css/fonts/linecons/css/linecons.css">
    <link rel="stylesheet" href="../assets/css/fonts/fontawesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="../assets/css/bootstrap.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <script src="../assets/js/jquery-1.11.1.min.js"></script>
    <script src="../assets/js/admin-nav.js"></script>
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
        <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>

<body class="admin-body">

    <!-- 主体布局 -->
    <div class="admin-container">

        <!-- 右侧内容区 -->
        <div class="admin-content">

            <!-- 缓存管理面板 -->
            <div class="admin-panel active" id="panel-cache">

                <!-- 缓存概览 -->
                <div class="ie-block" id="cache-overview-block">
                    <div class="ie-block-title">缓存概览</div>
                    <div id="cache-overview-content">
                        <div class="sync-status-row">
                            <span class="sync-status-label">缓存项总数：</span>
                            <span id="cache-total-count">—</span>
                        </div>
                        <div class="sync-status-row">
                            <span class="sync-status-label">WebStack 数据：</span>
                            <span id="cache-ws-count">—</span>
                        </div>
                        <div class="sync-status-row">
                            <span class="sync-status-label">其他数据：</span>
                            <span id="cache-other-count">—</span>
                        </div>
                        <div class="sync-status-row">
                            <span class="sync-status-label">预估大小：</span>
                            <span id="cache-size">—</span>
                        </div>
                    </div>
                </div>

                <!-- 缓存详情 -->
                <div class="ie-block">
                    <div class="ie-block-title">缓存详情</div>
                    <p class="ie-block-desc">以下是当前浏览器 localStorage 中存储的所有 WebStack 相关数据。</p>
                    <div id="cache-list-container">
                        <div class="cache-loading">加载中...</div>
                    </div>
                </div>

                <!-- 批量操作 -->
                <div class="ie-block">
                    <div class="ie-block-title">批量操作</div>
                    <p class="ie-block-desc">清理缓存数据，释放浏览器存储空间。</p>
                    <div class="oss-btn-row">
                        <button class="btn btn-warning" id="cache-clear-ws-btn">
                            <i class="fa fa-eraser"></i> 清理 WebStack 数据
                        </button>
                        <button class="btn btn-danger" id="cache-clear-all-btn">
                            <i class="fa fa-trash"></i> 清空所有缓存
                        </button>
                    </div>
                    <div id="cache-result" class="ie-result" style="display:none;margin-top:12px;"></div>
                </div>

                <!-- 导出备份 -->
                <div class="ie-block">
                    <div class="ie-block-title">导出备份</div>
                    <p class="ie-block-desc">在清理缓存前，建议先导出备份数据。</p>
                    <button class="btn btn-primary" id="cache-export-btn">
                        <i class="fa fa-download"></i> 导出所有缓存数据
                    </button>
                    <div id="cache-export-result" class="ie-result" style="display:none;margin-top:12px;"></div>
                </div>

            </div>

        </div>
    </div>

    <script src="../assets/js/bootstrap.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script>
        $(document).ready(function () {
            CacheManager.init();
        });
    </script>
</body>

</html>
