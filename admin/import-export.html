<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="viggo" />
    <title>WebStack 管理面板 - 导入/导出</title>
    <link rel="shortcut icon" href="../assets/images/favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Arimo:400,700,400italic">
    <link rel="stylesheet" href="../assets/css/fonts/linecons/css/linecons.css">
    <link rel="stylesheet" href="../assets/css/fonts/fontawesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="../assets/css/bootstrap.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <script src="../assets/js/jquery-1.11.1.min.js"></script>
    <script src="../assets/js/admin-nav.js"></script>
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
        <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>

<body class="admin-body">

    <!-- 主体布局 -->
    <div class="admin-container">

        <!-- 右侧内容区 -->
        <div class="admin-content">

            <!-- 导入/导出面板 -->
            <div class="admin-panel active" id="panel-import-export">

                <!-- 数据源状态栏 -->
                <div class="ie-source-bar">
                    <span>当前数据源：<strong id="ie-source-name">默认数据源</strong></span>
                    <span id="ie-source-hint" class="ie-source-hint" style="display:none;">
                        <i class="fa fa-info-circle"></i> 导入将切换至私有数据源
                    </span>
                </div>

                <!-- 区块1：导出数据 -->
                <div class="ie-block">
                    <div class="ie-block-title">导出数据</div>
                    <p class="ie-block-desc">将当前激活数据源导出为 JSON 文件</p>
                    <button class="btn btn-primary" id="ie-export-btn">
                        <i class="fa fa-download"></i> 导出 JSON 文件
                    </button>
                </div>

                <!-- 区块2：导入数据（文件） -->
                <div class="ie-block">
                    <div class="ie-block-title">导入数据（文件）</div>
                    <p class="ie-block-desc">从本地 JSON 文件导入数据，将覆盖当前私有数据源</p>
                    <input type="file" id="ie-import-file" accept=".json" style="display:none;">
                    <button class="btn btn-default" id="ie-import-file-btn">
                        <i class="fa fa-folder-open"></i> 选择 JSON 文件
                    </button>
                    <div id="ie-import-result" class="ie-result" style="display:none;"></div>
                </div>

                <!-- 区块3：复制 JSON -->
                <div class="ie-block">
                    <div class="ie-block-title">复制 JSON</div>
                    <p class="ie-block-desc">复制当前激活数据源的 JSON 文本</p>
                    <button class="btn btn-default" id="ie-show-json-btn">
                        <i class="fa fa-code"></i> 显示 JSON
                    </button>
                    <textarea id="ie-json-display" class="ie-textarea" rows="20" readonly style="display:none;"></textarea>
                    <button class="btn btn-default" id="ie-copy-btn" style="display:none;">
                        <i class="fa fa-clipboard"></i> 一键复制
                    </button>
                </div>

                <!-- 区块4：粘贴 JSON -->
                <div class="ie-block">
                    <div class="ie-block-title">粘贴 JSON</div>
                    <p class="ie-block-desc">粘贴 JSON 文本导入数据，将覆盖当前私有数据源</p>
                    <textarea id="ie-json-paste" class="ie-textarea" rows="20" placeholder="请在此粘贴 JSON 数据..."></textarea>
                    <button class="btn btn-primary" id="ie-paste-import-btn">
                        <i class="fa fa-upload"></i> 解析并导入
                    </button>
                    <div id="ie-paste-result" class="ie-result" style="display:none;"></div>
                </div>

                <!-- 区块5：导出到浏览器 -->
                <div class="ie-block">
                    <div class="ie-block-title">导出到浏览器</div>
                    <p class="ie-block-desc">将书签导出为 HTML 格式，可导入到 Chrome/Firefox/Edge/Safari 等浏览器</p>
                    
                    <!-- 数据源选择 -->
                    <div class="be-source-row">
                        <span>当前数据源：<strong id="be-source-name">默认数据源</strong></span>
                        <button class="btn btn-xs btn-default" id="be-switch-source-btn">
                            <i class="fa fa-exchange"></i> 切换数据源
                        </button>
                    </div>
                    
                    <!-- 操作按钮行 -->
                    <div class="be-action-row">
                        <button class="btn btn-xs btn-default" id="be-select-all-btn">
                            <i class="fa fa-check-square-o"></i> 全选
                        </button>
                        <button class="btn btn-xs btn-default" id="be-deselect-all-btn">
                            <i class="fa fa-square-o"></i> 取消全选
                        </button>
                        <button class="btn btn-primary" id="be-export-btn">
                            <i class="fa fa-download"></i> 导出选中书签
                        </button>
                    </div>
                    
                    <!-- 分类和书签选择树 -->
                    <div class="be-tree-container" id="be-tree-container">
                        <div class="be-loading">加载中...</div>
                    </div>
                    
                    <!-- 结果提示 -->
                    <div id="be-result" class="ie-result" style="display:none;"></div>
                </div>

            </div>

        </div>
    </div>

    <script src="../assets/js/bootstrap.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script>
        $(document).ready(function () {
            ImportExport.init();
            BrowserExportManager.init();
        });
    </script>
</body>

</html>
