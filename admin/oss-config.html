<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="viggo" />
    <title>WebStack 管理面板 - OSS 配置</title>
    <link rel="shortcut icon" href="../assets/images/favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Arimo:400,700,400italic">
    <link rel="stylesheet" href="../assets/css/fonts/linecons/css/linecons.css">
    <link rel="stylesheet" href="../assets/css/fonts/fontawesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="../assets/css/bootstrap.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <script src="../assets/js/jquery-1.11.1.min.js"></script>
    <script src="../assets/js/admin-nav.js"></script>
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
        <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>

<body class="admin-body">

    <!-- 主体布局 -->
    <div class="admin-container">

        <!-- 右侧内容区 -->
        <div class="admin-content">

            <!-- OSS 配置面板 -->
            <div class="admin-panel active" id="panel-oss-config">

                <div class="ie-block">
                    <div class="ie-block-title">OSS 配置</div>
                    <p class="ie-block-desc">配置阿里云 OSS 以启用数据云端备份与同步功能。建议使用仅有特定 Bucket 读写权限的 RAM 子账号。</p>

                    <div class="form-group">
                        <label>AccessKeyId</label>
                        <input type="text" class="form-control" id="oss-ak" placeholder="请输入 AccessKeyId" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>AccessKeySecret</label>
                        <input type="password" class="form-control" id="oss-sk" placeholder="请输入 AccessKeySecret" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>Bucket</label>
                        <input type="text" class="form-control" id="oss-bucket" placeholder="例如：my-webstack">
                    </div>
                    <div class="form-group">
                        <label>Region</label>
                        <input type="text" class="form-control" id="oss-region" placeholder="例如：oss-cn-hangzhou">
                    </div>
                    <div class="form-group">
                        <label>基础路径前缀</label>
                        <input type="text" class="form-control" id="oss-prefix" placeholder="例如：webstack/">
                        <p class="help-block" style="font-size:12px;color:#a0aab4;">文件将存储为 {前缀}version.json 和 {前缀}data-{版本号}.json</p>
                    </div>

                    <div class="oss-btn-row">
                        <button class="btn btn-primary" id="oss-save-btn">
                            <i class="fa fa-save"></i> 保存配置
                        </button>
                        <button class="btn btn-default" id="oss-test-btn">
                            <i class="fa fa-plug"></i> 测试连接
                        </button>
                        <button class="btn btn-default" id="oss-export-btn">
                            <i class="fa fa-download"></i> 导出配置
                        </button>
                        <label class="btn btn-default" style="margin:0;cursor:pointer;">
                            <i class="fa fa-upload"></i> 导入配置
                            <input type="file" id="oss-import-file" accept=".json" style="display:none;">
                        </label>
                    </div>

                    <div id="oss-result" class="ie-result" style="display:none;margin-top:12px;"></div>
                </div>

            </div>

        </div>
    </div>

    <script src="../assets/js/bootstrap.min.js"></script>
    <script src="https://gosspublic.alicdn.com/aliyun-oss-sdk-6.18.1.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script>
        $(document).ready(function () {
            OSSConfig.init();
        });
    </script>
</body>

</html>
