<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="viggo" />
    <title>WebStack 管理面板 - 书签管理</title>
    <link rel="shortcut icon" href="../assets/images/favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Arimo:400,700,400italic">
    <link rel="stylesheet" href="../assets/css/fonts/linecons/css/linecons.css">
    <link rel="stylesheet" href="../assets/css/fonts/fontawesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="../assets/css/bootstrap.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <script src="../assets/js/jquery-1.11.1.min.js"></script>
    <script src="../assets/js/admin-nav.js"></script>
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
        <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>

<body class="admin-body">

    <!-- 主体布局 -->
    <div class="admin-container">

        <!-- 右侧内容区 -->
        <div class="admin-content">

            <!-- 书签管理面板 -->
            <div class="admin-panel active" id="panel-bookmark">

                <!-- 只读提示 -->
                <div id="bm-readonly-tip" class="alert alert-warning" style="display:none;margin-bottom:16px;">
                    <i class="fa fa-lock" style="margin-right:6px;"></i>
                    默认数据源为只读，请切换至私有数据源后编辑。
                </div>

                <!-- 快速添加区域 -->
                <div class="ie-block" id="quick-add-block">
                    <div class="ie-block-title">⚡ 快速添加书签</div>
                    <p class="ie-block-desc">粘贴网址，自动获取标题和图标，快速保存到指定分类</p>
                    <div class="quick-add-row">
                        <input type="text" id="quick-add-url" class="form-control" placeholder="粘贴网址，如 https://dribbble.com/">
                        <button class="btn btn-primary" id="quick-add-fetch-btn">
                            <i class="fa fa-search"></i> 获取信息
                        </button>
                    </div>
                    <!-- 预览区 -->
                    <div id="quick-add-preview" style="display:none;margin-top:12px;">
                        <div class="quick-add-preview-row">
                            <img id="quick-add-logo-preview" src="../assets/images/favicon.png" width="32" height="32" style="border-radius:50%;object-fit:cover;flex-shrink:0;">
                            <div class="quick-add-preview-info">
                                <input type="text" id="quick-add-name" class="form-control" placeholder="书签名称">
                                <input type="text" id="quick-add-logo" class="form-control" placeholder="Logo 地址（可留空）" style="margin-top:6px;">
                            </div>
                        </div>
                        <div class="quick-add-preview-row" style="margin-top:8px;">
                            <label style="font-size:13px;color:#5a6a7a;margin-right:8px;white-space:nowrap;">保存到：</label>
                            <select id="quick-add-category" class="form-control" style="flex:1;"></select>
                            <button class="btn btn-primary" id="quick-add-save-btn" style="margin-left:8px;white-space:nowrap;">
                                <i class="fa fa-save"></i> 保存
                            </button>
                        </div>
                        <div id="quick-add-result" class="ie-result" style="display:none;margin-top:8px;"></div>
                    </div>
                </div>

                <!-- 工具栏 -->
                <div class="cat-toolbar">
                    <div class="cat-toolbar-left">
                        <span class="cat-source-label">当前数据源：<strong id="bm-source-name">默认数据源</strong></span>
                        <button class="btn btn-sm btn-default" id="bm-switch-source-btn" style="margin-left:10px;">
                            <i class="fa fa-exchange"></i> 切换数据源
                        </button>
                    </div>
                </div>

                <!-- 书签列表容器 -->
                <div id="bookmark-list">
                    <div class="bm-loading">加载中...</div>
                </div>

            </div>

        </div>
    </div>

    <!-- 添加/编辑书签 Modal -->
    <div class="modal fade" id="modal-bookmark" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-sm" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                    <h4 class="modal-title" id="modal-bm-title">添加书签</h4>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modal-bm-mode" value="add">
                    <input type="hidden" id="modal-bm-cat-id" value="">
                    <input type="hidden" id="modal-bm-parent-id" value="">
                    <input type="hidden" id="modal-bm-index" value="-1">

                    <div class="form-group">
                        <label>书签名称</label>
                        <input type="text" class="form-control" id="modal-bm-name" placeholder="例如：Dribbble">
                    </div>
                    <div class="form-group">
                        <label>URL</label>
                        <input type="text" class="form-control" id="modal-bm-url" placeholder="https://example.com/">
                    </div>
                    <div class="form-group">
                        <label>Logo 图片地址</label>
                        <div class="bm-logo-input-row">
                            <img id="modal-bm-logo-preview" src="../assets/images/favicon.png" width="32" height="32" style="border-radius:50%;object-fit:cover;flex-shrink:0;">
                            <input type="text" class="form-control" id="modal-bm-logo" placeholder="留空则使用默认图标">
                            <button type="button" class="btn btn-default btn-sm" id="modal-bm-logo-fetch" title="从 URL 自动获取图标">
                                <i class="fa fa-refresh"></i>
                            </button>
                            <button type="button" class="btn btn-default btn-sm" id="modal-bm-logo-pick" title="从本地 logos 文件夹选择">
                                <i class="fa fa-folder-open"></i>
                            </button>
                        </div>
                        <p class="help-block" id="modal-bm-logo-hint" style="margin:4px 0 0;font-size:12px;color:#a0aab4;">填写 URL 后可自动获取网站图标</p>
                    </div>
                    <div class="form-group">
                        <label>所属分类</label>
                        <select class="form-control" id="modal-bm-category">
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="modal-bm-save">保存</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Logo 选择器 Modal -->
    <div class="modal fade" id="modal-logo-picker" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                    <h4 class="modal-title">选择 Logo</h4>
                </div>
                <div class="modal-body">
                    <!-- 常用 Logo 区域 -->
                    <div id="logo-picker-used-section" style="display:none;margin-bottom:14px;">
                        <div style="font-size:12px;color:#8a9bb0;font-weight:600;margin-bottom:6px;letter-spacing:.5px;">
                            <i class="fa fa-star" style="margin-right:4px;color:#f0a500;"></i>常用 Logo（来自当前数据源）
                        </div>
                        <div id="logo-picker-used-grid" style="display:flex;flex-wrap:wrap;gap:8px;max-height:160px;overflow-y:auto;padding:4px 0;"></div>
                        <hr style="margin:12px 0 10px;">
                    </div>
                    <!-- 全量搜索 -->
                    <input type="text" class="form-control" id="logo-picker-search" placeholder="搜索 logo 名称..." style="margin-bottom:12px;">
                    <div id="logo-picker-grid" style="display:flex;flex-wrap:wrap;gap:8px;max-height:340px;overflow-y:auto;"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/bootstrap.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script>
        $(document).ready(function () {
            BookmarkManager.render();
            BookmarkManager._bindEvents();
        });
    </script>
</body>

</html>
