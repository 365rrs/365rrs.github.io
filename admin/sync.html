<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="viggo" />
    <title>WebStack 管理面板 - 同步状态</title>
    <link rel="shortcut icon" href="../assets/images/favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Arimo:400,700,400italic">
    <link rel="stylesheet" href="../assets/css/fonts/linecons/css/linecons.css">
    <link rel="stylesheet" href="../assets/css/fonts/fontawesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="../assets/css/bootstrap.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <script src="../assets/js/jquery-1.11.1.min.js"></script>
    <script src="../assets/js/admin-nav.js"></script>
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
        <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>

<body class="admin-body">

    <!-- 主体布局 -->
    <div class="admin-container">

        <!-- 右侧内容区 -->
        <div class="admin-content">

            <!-- 同步状态面板 -->
            <div class="admin-panel active" id="panel-sync">

                <!-- 同步状态区域 -->
                <div class="ie-block" id="sync-status-block">
                    <div class="ie-block-title">同步状态</div>
                    <div id="sync-status-content">
                        <div class="sync-status-row">
                            <span class="sync-status-label">最后上传：</span>
                            <span id="sync-last-upload">—</span>
                        </div>
                        <div class="sync-status-row">
                            <span class="sync-status-label">上传版本：</span>
                            <span id="sync-last-upload-ver">—</span>
                        </div>
                        <div class="sync-status-row">
                            <span class="sync-status-label">最后下载：</span>
                            <span id="sync-last-download">—</span>
                        </div>
                        <div class="sync-status-row">
                            <span class="sync-status-label">下载版本：</span>
                            <span id="sync-last-download-ver">—</span>
                        </div>
                        <div class="sync-status-row">
                            <span class="sync-status-label">本地版本：</span>
                            <span id="sync-local-ver">—</span>
                        </div>
                        <div class="sync-status-row">
                            <span class="sync-status-label">应用版本：</span>
                            <span id="sync-app-ver">—</span>
                        </div>
                    </div>
                </div>

                <!-- 手动同步 -->
                <div class="ie-block">
                    <div class="ie-block-title">手动同步</div>
                    <p class="ie-block-desc">手动将本地私有数据上传至 OSS，或从 OSS 下载最新数据覆盖本地。</p>
                    <div id="sync-oss-incomplete-tip" class="ie-result ie-result-err" style="display:none;margin-bottom:10px;">
                        <i class="fa fa-exclamation-circle"></i> OSS 配置不完整，请先前往 <a href="#" id="sync-goto-oss-config">OSS 配置</a> 面板完成配置。
                    </div>
                    <div class="oss-btn-row">
                        <button class="btn btn-primary" id="sync-upload-btn" disabled>
                            <i class="fa fa-cloud-upload"></i> 上传至 OSS
                        </button>
                        <button class="btn btn-default" id="sync-download-btn" disabled>
                            <i class="fa fa-cloud-download"></i> 从 OSS 下载
                        </button>
                    </div>
                    <div id="sync-result" class="ie-result" style="display:none;margin-top:12px;"></div>
                </div>

                <!-- 自动同步配置 -->
                <div class="ie-block">
                    <div class="ie-block-title">自动同步配置</div>
                    <div class="form-group sync-config-row">
                        <label class="sync-toggle-label">
                            <input type="checkbox" id="sync-on-load"> 页面加载时自动同步
                        </label>
                        <p class="help-block" style="font-size:12px;color:#a0aab4;margin:4px 0 0;">打开主页时自动检查 OSS 版本并下载最新数据</p>
                    </div>
                    <div class="form-group sync-config-row">
                        <label class="sync-toggle-label">
                            <input type="checkbox" id="sync-interval-enable"> 定时自动同步
                        </label>
                        <div id="sync-interval-wrap" style="margin-top:8px;display:none;">
                            <select class="form-control" id="sync-interval-select" style="width:auto;display:inline-block;">
                                <option value="1800">每 30 分钟</option>
                                <option value="3600" selected>每 1 小时</option>
                                <option value="7200">每 2 小时</option>
                            </select>
                        </div>
                    </div>
                    <button class="btn btn-primary" id="sync-config-save-btn">
                        <i class="fa fa-save"></i> 保存自动同步配置
                    </button>
                    <div id="sync-config-result" class="ie-result" style="display:none;margin-top:10px;"></div>
                </div>

            </div>

        </div>
    </div>

    <script src="../assets/js/bootstrap.min.js"></script>
    <script src="https://gosspublic.alicdn.com/aliyun-oss-sdk-6.18.1.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script>
        $(document).ready(function () {
            SyncManager.renderStatus();
            SyncManager.init();
            // 覆盖跨页面导航：跳转至 oss-config.html（原逻辑为 Tab 切换）
            $('#sync-goto-oss-config').off('click').on('click', function (e) {
                e.preventDefault();
                window.location.href = './oss-config.html';
            });
        });
    </script>
</body>

</html>
