<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="viggo" />
    <title>WebStack 管理面板 - 分类管理</title>
    <link rel="shortcut icon" href="../assets/images/favicon.png">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Arimo:400,700,400italic">
    <link rel="stylesheet" href="../assets/css/fonts/linecons/css/linecons.css">
    <link rel="stylesheet" href="../assets/css/fonts/fontawesome/css/font-awesome.min.css">
    <link rel="stylesheet" href="../assets/css/bootstrap.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <script src="../assets/js/jquery-1.11.1.min.js"></script>
    <script src="../assets/js/admin-nav.js"></script>
    <!--[if lt IE 9]>
        <script src="https://oss.maxcdn.com/html5shiv/3.7.2/html5shiv.min.js"></script>
        <script src="https://oss.maxcdn.com/respond/1.4.2/respond.min.js"></script>
    <![endif]-->
</head>

<body class="admin-body">

    <!-- 主体布局 -->
    <div class="admin-container">

        <!-- 右侧内容区 -->
        <div class="admin-content">

            <!-- 分类管理面板 -->
            <div class="admin-panel active" id="panel-category">

                <!-- 只读提示（默认数据源时显示） -->
                <div id="cat-readonly-tip" class="alert alert-warning" style="display:none;margin-bottom:16px;">
                    <i class="fa fa-lock" style="margin-right:6px;"></i>
                    默认数据源为只读，请切换至私有数据源后编辑。
                </div>

                <!-- 工具栏 -->
                <div class="cat-toolbar">
                    <div class="cat-toolbar-left">
                        <span class="cat-source-label">当前数据源：<strong id="cat-source-name">默认数据源</strong></span>
                        <button class="btn btn-sm btn-default" id="cat-switch-source-btn" style="margin-left:10px;">
                            <i class="fa fa-exchange"></i> 切换数据源
                        </button>
                    </div>
                    <div class="cat-toolbar-right">
                        <button class="btn btn-sm btn-primary" id="cat-add-btn">
                            <i class="fa fa-plus"></i> 添加一级分类
                        </button>
                    </div>
                </div>

                <!-- 分类树 -->
                <div id="category-tree" class="category-tree-wrap">
                    <div class="cat-loading">加载中...</div>
                </div>

            </div>

        </div>
    </div>

    <!-- 添加/编辑分类 Modal -->
    <div class="modal fade" id="modal-category" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-sm" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
                    <h4 class="modal-title" id="modal-cat-title">添加一级分类</h4>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="modal-cat-mode" value="add-top">
                    <input type="hidden" id="modal-cat-id" value="">
                    <input type="hidden" id="modal-cat-parent-id" value="">

                    <div class="form-group" id="modal-cat-name-group">
                        <label>分类名称 <small class="text-muted">（支持 emoji）</small></label>
                        <input type="text" class="form-control" id="modal-cat-name" placeholder="例如：🔥 热门推荐">
                    </div>

                    <!-- 所属一级分类下拉（仅编辑二级分类时显示） -->
                    <div class="form-group" id="modal-cat-parent-group" style="display:none;">
                        <label>所属一级分类</label>
                        <select class="form-control" id="modal-cat-parent-select">
                            <!-- 动态填充 -->
                        </select>
                    </div>

                    <div class="form-group" id="modal-cat-icon-group">
                        <label>图标</label>
                        <div class="icon-picker" id="icon-picker">
                            <label class="icon-option">
                                <input type="radio" name="cat-icon" value="linecons-star" checked>
                                <span class="icon-preview"><i class="linecons-star"></i></span>
                            </label>
                            <label class="icon-option">
                                <input type="radio" name="cat-icon" value="linecons-doc">
                                <span class="icon-preview"><i class="linecons-doc"></i></span>
                            </label>
                            <label class="icon-option">
                                <input type="radio" name="cat-icon" value="linecons-lightbulb">
                                <span class="icon-preview"><i class="linecons-lightbulb"></i></span>
                            </label>
                            <label class="icon-option">
                                <input type="radio" name="cat-icon" value="linecons-thumbs-up">
                                <span class="icon-preview"><i class="linecons-thumbs-up"></i></span>
                            </label>
                            <label class="icon-option">
                                <input type="radio" name="cat-icon" value="linecons-diamond">
                                <span class="icon-preview"><i class="linecons-diamond"></i></span>
                            </label>
                            <label class="icon-option">
                                <input type="radio" name="cat-icon" value="linecons-pencil">
                                <span class="icon-preview"><i class="linecons-pencil"></i></span>
                            </label>
                            <label class="icon-option">
                                <input type="radio" name="cat-icon" value="linecons-user">
                                <span class="icon-preview"><i class="linecons-user"></i></span>
                            </label>
                            <label class="icon-option">
                                <input type="radio" name="cat-icon" value="linecons-heart">
                                <span class="icon-preview"><i class="linecons-heart"></i></span>
                            </label>
                            <label class="icon-option">
                                <input type="radio" name="cat-icon" value="linecons-cog">
                                <span class="icon-preview"><i class="linecons-cog"></i></span>
                            </label>
                            <label class="icon-option">
                                <input type="radio" name="cat-icon" value="linecons-tag">
                                <span class="icon-preview"><i class="linecons-tag"></i></span>
                            </label>
                            <label class="icon-option">
                                <input type="radio" name="cat-icon" value="linecons-search">
                                <span class="icon-preview"><i class="linecons-search"></i></span>
                            </label>
                            <label class="icon-option">
                                <input type="radio" name="cat-icon" value="linecons-cloud">
                                <span class="icon-preview"><i class="linecons-cloud"></i></span>
                            </label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-default" data-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="modal-cat-save">保存</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../assets/js/bootstrap.min.js"></script>
    <script src="../assets/js/app.js"></script>
    <script src="../assets/js/admin.js"></script>
    <script>
        $(document).ready(function () {
            CategoryManager.init();
        });
    </script>
</body>

</html>
